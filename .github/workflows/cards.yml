name: Render README cards

on:
  schedule:
    - cron: "17 1 * * *" # 06:47 IST, after the previous day has settled
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - "assets/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet fonttools pillow

      - name: Fetch contribution + repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py

      - name: Render README cards
        run: |
          python scripts/render_readme_cards.py
          THEME=light python scripts/render_readme_cards.py

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "cards: redraw from today's data"
            git push
          fi
